document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x;margin-left:auto;margin-right:auto;\">Sleep is busy, essential work your body is doing.<\u002Fp><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:34px;max-width:1480px;margin:0 auto;width:100%;\"><div style=\"background:#E6E5F8;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><div style=\"width:78px;height:78px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"42\" height=\"42\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M41 32C37 38 29 40 23 36C17 32 16 24 20 18C13 20 9 28 12 35C15 43 24 47 32 44C37 42 40 38 41 32Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#463CA8;\">Sleep<\u002Fdiv><\u002Fdiv><p style=\"font-size:24px;font-weight:700;color:#3B3582;margin-bottom:13px;\">Essential work your brain and body do every night.<\u002Fp><div style=\"font-size:22px;font-weight:500;color:#5E588F;line-height:1.55;text-align:justify;\">While you sleep, your brain stores memories, your body repairs itself, and your mood resets. It is as important as food and movement.<\u002Fdiv><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><div style=\"width:78px;height:78px;border-radius:18px;background:#E8A33D;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"42\" height=\"42\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#463CA8;\">Not laziness<\u002Fdiv><\u002Fdiv><p style=\"font-size:24px;font-weight:700;color:#3B3582;margin-bottom:13px;\">Needing sleep is biology, not weakness.<\u002Fp><div style=\"font-size:22px;font-weight:500;color:#5E588F;line-height:1.55;text-align:justify;\">Teens are wired to fall asleep and wake later. Wanting more sleep is not being lazy, it is your developing body doing its job.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Why it matters\" data-screen-label=\"04\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#D7D6F2;font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"f9555c52-51b5-4e04-9885-353fe8d478a1\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><svg width=\"160\" height=\"60\" viewBox=\"0 0 170 64\" fill=\"none\" style=\"position:absolute;top:74px;right:110px;\"><rect x=\"30\" y=\"22\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#F2E7C9\" stroke-width=\"7\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#3B3582\" stroke-width=\"6\"><\u002Frect><\u002Fsvg><div style=\"position:absolute;bottom:80px;left:104px;width:150px;height:46px;background-image:radial-gradient(#5B52C9 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Why This Matters<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#5E588F;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Most teens run on way less sleep than their bodies need.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"background:#E6E5F8;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#463CA8;\">8-10<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#5E588F;margin-top:12px;line-height:1.4;\">hours of sleep a night is recommended for teens aged 14 to 17.<\u002Fdiv><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#463CA8;\">~2 hrs<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#5E588F;margin-top:12px;line-height:1.4;\">later is when the teen body clock naturally wants to sleep.<\u002Fdiv><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#463CA8;\">Memory<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#5E588F;margin-top:12px;line-height:1.4;\">is consolidated during sleep, so rest helps you learn.<\u002Fdiv><\u002Fdiv><div style=\"background:#E8A33D;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(40,40,80,0.16);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#fff;\">Tonight<\u002Fdiv><div style=\"font-size:20px;font-weight:700;color:#fff;margin-top:12px;line-height:1.4;\">a consistent bedtime is the single biggest fix.<\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"font-family:'Mulish';font-size:18px;font-weight:600;color:#928CC2;text-align:center;margin-top:34px;\">Source: Canadian 24-Hour Movement Guidelines; Canadian Paediatric Society<\u002Fp><\u002Fsection>\n<section data-label=\"The science\" data-screen-label=\"05\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#CBC9EE;font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"21673170-f378-475f-b3d9-ced807cde9a0\" alt=\"\" style=\"position:absolute;left:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:84px;left:110px;width:150px;height:46px;background-image:radial-gradient(#5B52C9 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #8C84DD;opacity:0.38;bottom:-130px;right:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Why Teens Feel Awake at Night<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#5E588F;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Staying up late isn't a flaw. Your body clock genuinely shifts as a teen.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M24 12C18 12 15 16 16 21C12 22 12 28 16 30C15 35 19 39 24 38M32 12C38 12 41 16 40 21C44 22 44 28 40 30C41 35 37 39 32 38M24 12C26 10 30 10 32 12M24 38C26 40 30 40 32 38M28 13V38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Shifted clock<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Melatonin comes later in puberty<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M41 32C37 38 29 40 23 36C17 32 16 24 20 18C13 20 9 28 12 35C15 43 24 47 32 44C37 42 40 38 41 32Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Later sleep drive<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">You feel alert at 11pm<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"31\" r=\"16\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 22V31L34 35M22 9H34M28 9V15\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Early school start<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Clashes with your biology<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M31 7L16 32H27L25 49L41 23H30L31 7Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Sleep debt builds<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Lost hours add up all week<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"11\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 6V13M28 43V50M6 28H13M43 28H50M13 13L18 18M43 43L38 38M43 13L38 18M13 43L18 38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Weekend swings<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Sleeping in shifts the clock<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"19\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 26V37\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"19\" r=\"1.8\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">It is normal<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">This is biology, not a flaw<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Sleep stealers\" data-screen-label=\"06\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#D7D6F2;font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"bdf6a7f3-7f53-4c35-828e-2222ea39698a\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><svg width=\"160\" height=\"60\" viewBox=\"0 0 170 64\" fill=\"none\" style=\"position:absolute;top:74px;left:110px;\"><rect x=\"30\" y=\"22\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#F2E7C9\" stroke-width=\"7\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#3B3582\" stroke-width=\"6\"><\u002Frect><\u002Fsvg><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #8C84DD;opacity:0.38;bottom:-130px;right:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">What Wrecks Your Sleep<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#5E588F;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Spot these and most of them are fixable.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M19 8H25L28 19L23 22C25 28 30 33 36 35L39 30L50 33V39C50 44 46 47 41 46C24 43 13 32 10 15C9 10 12 8 17 8\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Screens in bed<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Blue light blocks melatonin<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 8C28 8 14 24 14 34C14 42 20 48 28 48C36 48 42 42 42 34C42 24 28 8 28 8Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Caffeine<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Energy drinks late ruin sleep<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M24 12C18 12 15 16 16 21C12 22 12 28 16 30C15 35 19 39 24 38M32 12C38 12 41 16 40 21C44 22 44 28 40 30C41 35 37 39 32 38M24 12C26 10 30 10 32 12M24 38C26 40 30 40 32 38M28 13V38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Racing thoughts<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Stress keeps you wired<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"11\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 6V13M28 43V50M6 28H13M43 28H50M13 13L18 18M43 43L38 38M43 13L38 18M13 43L18 38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Irregular hours<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Different times confuse the clock<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M31 7L16 32H27L25 49L41 23H30L31 7Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div st font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">How to Get Real Rest<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#5E588F;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">A few small changes add up to much better sleep.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"31\" r=\"16\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 22V31L34 35M22 9H34M28 9V15\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Same time daily<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Consistent bed and wake times.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M19 8H25L28 19L23 22C25 28 30 33 36 35L39 30L50 33V39C50 44 46 47 41 46C24 43 13 32 10 15C9 10 12 8 17 8\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Phone out of bed<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Charge it across the room.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M41 32C37 38 29 40 23 36C17 32 16 24 20 18C13 20 9 28 12 35C15 43 24 47 32 44C37 42 40 38 41 32Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Wind-down routine<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">Dim lights, no screens, 30 minutes before.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E6E5F8;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#5B52C9;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 8C28 8 14 24 14 34C14 42 20 48 28 48C36 48 42 42 42 34C42 24 28 8 28 8Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Cut afternoon caffeine<\u002Fdiv><div style=\"font-size:20px;color:#928CC2;font-weight:600;margin-top:5px;\">No energy drinks after lunch.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Myth vs fact\" data-screen-label=\"08\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#D7D6F2;font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"e36322b5-0b14-43e6-9ca8-c5c0e1fffad6\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><svg width=\"160\" height=\"60\" viewBox=\"0 0 170 64\" fill=\"none\" style=\"position:absolute;top:74px;right:110px;\"><rect x=\"30\" y=\"22\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#F2E7C9\" stroke-width=\"7\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#3B3582\" stroke-width=\"6\"><\u002Frect><\u002Fsvg><div style=\"position:absolute;bottom:80px;left:104px;width:150px;height:46px;background-image:radial-gradient(#5B52C9 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Myth vs Fact<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#5E588F;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">A few things people get wrong about sleep.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:18px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;\"><div style=\"background:#C3C0E8;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#928CC2\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#928CC2\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:600;line-height:1.35;color:#5E588F;\">You can catch up at the weekend.<\u002Fp><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#5B52C9\" stroke-width=\"3\"><\u002Fcircle><path d=\"M19 28L25 34L37 21\" stroke=\"#5B52C9\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:700;line-height:1.35;color:#3B3582;\">Big weekend lie-ins shift your clock and make Monday worse.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;\"><div style=\"background:#C3C0E8;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#928CC2\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#928CC2\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:600;line-height:1.35;color:#5E588F;\">Needing more sleep means you are lazy.<\u002Fp><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#5B52C9\" stroke-width=\"3\"><\u002Fcircle><path d=\"M19 28L25 34L37 21\" stroke=\"#5B52C9\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:700;line-height:1.35;color:#3B3582;\">Teens genuinely need 8 to 10 hours. It is biology.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;\"><div style=\"background:#C3C0E8;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#928CC2\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#928CC2\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:600;line-height:1.35;color:#5E588F;\">Scrolling helps me wind down.<\u002Fp><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#5B52C9\" stroke-width=\"3\"><\u002Fcircle><path d=\"M19 28L25 34L37 21\" stroke=\"#5B52C9\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:700;line-height:1.35;color:#3B3582;\">Screen light and content keep your brain alert, not calm.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"In focus\" data-screen-label=\"09\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#CBC9EE;font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;align-items:center;gap:64px;padding:0 110px;\"><img src=\"14b86936-0a40-4b3c-bc7a-4b40c324732c\" alt=\"\" style=\"position:absolute;left:26px;top:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:80px;right:120px;width:150px;height:46px;background-image:radial-gradient(#5B52C9 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #8C84DD;opacity:0.38;bottom:-130px;left:-110px;\"><\u002Fdiv><div style=\"flex:none;width:620px;height:680px;border-radius:28px;border:6px solid #fff;box-shadow:0 16px 40px rgba(40,40,80,0.20);overflow:hidden;background:#C3C0E8;\"><image-slot id=\"sleep-photo-v2\" src=\"b4e68a56-e388-4a03-96c6-20b9d5976f09\" style=\"width:100%;height:100%;display:block;background:#DCDAF4;\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop your own photo here to replace this one\"><\u002Fimage-slot><\u002Fdiv><div style=\"flex:1;\"><div style=\"font-family:'Mulish';font-weight:800;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;color:#928CC2;margin-bottom:10px;\">Build the habit<\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:60px;line-height:1.0;margin-bottom:18px;\">Your Wind-Down Routine<\u002Fh2><p style=\"font-family:'Mulish';font-weight:500;font-size:23px;color:#5E588F;line-height:1.5;margin-bottom:30px;max-width:760px;\">A simple routine tells your brain it is time to sleep. Build one you can repeat every night.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:16px;max-width:780px;\"><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#5B52C9;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">1<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#3B3582;\">Same bedtime, even on weekends<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#5B52C9;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">2<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#3B3582;\">Screens off about 30 minutes before<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#5B52C9;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">3<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#3B3582;\">Dim the lights and cool the room<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#E8A33D;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">4<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#3B3582;\">Read or stretch to signal sleep<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Activity\" data-screen-label=\"10\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#D7D6F2;font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"8f94bf89-8745-456a-8acb-9090646690c2\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:84px;left:110px;width:150px;height:46px;background-image:radial-gradient(#5B52C9 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #8C84DD;opacity:0.38;bottom:-130px;right:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Your Turn, Fix the Night<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#5E588F;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Small groups.<\u002Fp><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:34px;max-width:1480px;margin:0 auto;width:100%;\"><div style=\"background:#E6E5F8;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:800;font-size:34px;color:#E8A33D;margin-bottom:18px;\">Scenario<\u002Fdiv><p style=\"font-size:23px;font-weight:500;color:#5E588F;line-height:1.5;\">A friend scrolls until 1am every night and is exhausted at school. Redesign their evening.<\u002Fp><\u002Fdiv><div style=\"background:#E6E5F8;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:800;font-size:34px;color:#463CA8;margin-bottom:18px;\">Talk about it<\u002Fdiv><ul style=\"font-size:23px;font-weight:500;color:#5E588F;line-height:1.7;padding-left:24px;margin:0;\"><li>What is your own biggest sleep stealer?<\u002Fli><li>What time would a realistic bedtime be?<\u002Fli><li>Where could your phone charge instead?<\u002Fli><li>What could replace late-night scrolling?<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Recap\" data-screen-label=\"11\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(150deg,#C9C6EE 0%,#D7D6F2 70%);font-family:'Mulish',sans-serif;color:#3B3582;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 110px;\"><img src=\"41df8c5b-0b2b-478f-af4e-ba4c25cfc5fb\" alt=\"\" style=\"position:absolute;left:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;width:380px;height:380px;border-radius:50%;border:54px solid #8C84DD;opacity:0.4;top:-160px;right:-150px;\"><\u002Fdiv><div style=\"position:absolute;width:200px;height:200px;border-radius:50%;background:#463CA8;opacity:0.5;bottom:-100px;left:-100px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:74px;margin-bottom:30px;position:relative;\">Three Things to Carry<\u002Fh2><div style=\"display:flex;gap:22px;margin-bottom:42px;position:relative;\"><div style=\"width:230px;background:#E6E5F8;border-radius:22px;padding:30px;box-shadow:0 10px 26px rgba(60,55,95,0.10);\"><div style=\"width:76px;height:76px;border-radius:19px;background:#5B52C9;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M41 32C37 38 29 40 23 36C17 32 16 24 20 18C13 20 9 28 12 35C15 43 24 47 32 44C37 42 40 38 41 32Z\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#3B3582;\">Rest<\u002Fdiv><\u002Fdiv><div style=\"width:230px;background:#E6E5F8;border-radius:22px;padding:30px;box-shadow:0 10px 26px rgba(60,55,95,0.10);\"><div style=\"width:76px;height:76px;border-radius:19px;background:#5B52C9;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"31\" r=\"16\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle><path d=\"M28 22V31L34 35M22 9H34M28 9V15\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#3B3582;\">Routine<\u002Fdiv><\u002Fdiv><div style=\"width:230px;background:#E8A33D;border-radius:22px;padding:30px;box-shadow:0 10px 26px rgba(60,55,95,0.10);\"><div style=\"width:76px;height:76px;border-radius:19px;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M19 8H25L28 19L23 22C25 28 30 33 36 35L39 30L50 33V39C50 44 46 47 41 46C24 43 13 32 10 15C9 10 12 8 17 8\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#fff;\">Unplug<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1180px;width:100%;position:relative;\"><div style=\"background:rgba(255,255,255,0.5);border-radius:18px;padding:26px 32px;text-align:left;\"><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;margin-bottom:8px;\">Aim for<\u002Fdiv><p style=\"font-size:21px;font-weight:500;color:#5E588F;line-height:1.4;\">8 to 10 hours a night, with a consistent bed and wake time.<\u002Fp><\u002Fdiv><div style=\"background:rgba(255,255,255,0.5);border-radius:18px;padding:26px 32px;text-align:left;\"><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;margin-bottom:8px;\">Need to talk?<\u002Fdiv><p style=\"font-size:21px;font-weight:500;color:#5E588F;line-height:1.4;\">Sleep struggles tied to stress or mood? Kids Help Phone: 1-800-668-6868.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;bottom:54px;display:flex;align-items:center;gap:12px;\"><div style=\"width:38px;height:38px;border-radius:11px;background:#5B52C9;display:flex;align-items:center;justify-content:center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span style=\"font-family:'Playfair Display';font-weight:700;font-size:24px;color:#3B3582;\">Together for Health<\u002Fspan><\u002Fdiv><\u002Fsection>\n<!--MORE-->\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
