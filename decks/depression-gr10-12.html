document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

28 24V33\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"39\" r=\"1.7\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Why it matters<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">It is common and serious<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M24 12C18 12 15 16 16 21C12 22 12 28 16 30C15 35 19 39 24 38M32 12C38 12 41 16 40 21C44 22 44 28 40 30C41 35 37 39 32 38M24 12C26 10 30 10 32 12M24 38C26 40 30 40 32 38M28 13V38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">What causes it<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Not weakness or a choice<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M14 42C12 28 22 13 44 12C44 33 33 44 16 44\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M18 40C24 32 32 26 40 22\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">What helps<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Treatment and daily habits<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M10 30L20 40C22 42 25 43 28 43H40C44 43 46 40 46 36\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M30 10C27 7 22 8 21 13C20 17 28 24 28 24C28 24 36 17 35 13C34 8 30 8 30 12\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Helping a friend<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">And when to get an adult<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Define\" data-screen-label=\"03\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#C2D6F0;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"d0e1ff2c-5db4-4de3-8d61-f33b2f5d8fdd\" alt=\"\" style=\"position:absolute;left:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:84px;right:120px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #6E9BD6;opacity:0.38;top:-130px;left:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">More Than Just Feeling Sad<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Sadness passes. Depression sits heavier and sticks around.<\u002Fp><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:34px;max-width:1480px;margin:0 auto;width:100%;\"><div style=\"background:#E1ECF9;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><div style=\"width:78px;height:78px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"42\" height=\"42\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M41 32C37 38 29 40 23 36C17 32 16 24 20 18C13 20 9 28 12 35C15 43 24 47 32 44C37 42 40 38 41 32Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#2E5894;\">Depression<\u002Fdiv><\u002Fdiv><p style=\"font-size:24px;font-weight:700;color:#2D4E7E;margin-bottom:13px;\">A low mood or loss of interest lasting two weeks or more.<\u002Fp><div style=\"font-size:22px;font-weight:500;color:#566E94;line-height:1.55;text-align:justify;\">It affects sleep, energy, appetite, and focus, and gets in the way of everyday life. It is a real health condition, and it is treatable.<\u002Fdiv><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><div style=\"width:78px;height:78px;border-radius:18px;background:#F2B84B;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"42\" height=\"42\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"11\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 6V13M28 43V50M6 28H13M43 28H50M13 13L18 18M43 43L38 38M43 13L38 18M13 43L18 38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#2E5894;\">Ordinary sadness<\u002Fdiv><\u002Fdiv><p style=\"font-size:24px;font-weight:700;color:#2D4E7E;margin-bottom:13px;\">A normal, passing reaction to life.<\u002Fp><div style=\"font-size:22px;font-weight:500;color:#566E94;line-height:1.55;text-align:justify;\">Everyone feels down sometimes, and it lifts. Depression is deeper, lasts longer, and does not simply go away when things improve.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Why it matters\" data-screen-label=\"04\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#CFE0F4;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"633ec1ab-7537-4eae-9512-cf8880579bc1\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><svg width=\"160\" height=\"60\" viewBox=\"0 0 170 64\" fill=\"none\" style=\"position:absolute;top:74px;right:110px;\"><rect x=\"30\" y=\"22\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#F2E7C9\" stroke-width=\"7\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#2D4E7E\" stroke-width=\"6\"><\u002Frect><\u002Fsvg><div style=\"position:absolute;bottom:80px;left:104px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Why This Matters<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">It's one of the most common health conditions, and it often shows up young.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"background:#E1ECF9;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#2E5894;\">1 in 5<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#566E94;margin-top:12px;line-height:1.4;\">youth experience a mental illness such as depression before adulthood.<\u002Fdiv><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#2E5894;\">2 weeks<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#566E94;margin-top:12px;line-height:1.4;\">or more of constant low mood or lost interest is the key warning sign.<\u002Fdiv><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#2E5894;\">Most<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#566E94;margin-top:12px;line-height:1.4;\">people get better with the right support and treatment.<\u002Fdiv><\u002Fdiv><div style=\"background:#F2B84B;border-radius:22px;padding:36px 30px;box-shadow:0 8px 24px rgba(40,40,80,0.16);\"><div style=\"font-family:'Playfair Display';font-weight:900;font-size:68px;line-height:1;color:#fff;\">9-8-8<\u002Fdiv><div style=\"font-size:20px;font-weight:700;color:#fff;margin-top:12px;line-height:1.4;\">is Canada’s suicide crisis line, call or text any time.<\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"font-family:'Mulish';font-size:18px;font-weight:600;color:#8AA4C8;text-align:center;margin-top:34px;\">Source: Canadian Mental Health Association; Government of Canada<\u002Fp><\u002Fsection>\n<section data-label=\"Where it comes from\" data-screen-label=\"05\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#C2D6F0;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"c16238d8-f0a8-46f3-8644-1f1abd3b38b8\" alt=\"\" style=\"position:absolute;left:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:84px;left:110px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #6E9BD6;opacity:0.38;bottom:-130px;right:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">It Is Not a Choice<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">It has lots of causes. None of them mean you failed at something.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M24 12C18 12 15 16 16 21C12 22 12 28 16 30C15 35 19 39 24 38M32 12C38 12 41 16 40 21C44 22 44 28 40 30C41 35 37 39 32 38M24 12C26 10 30 10 32 12M24 38C26 40 30 40 32 38M28 13V38\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Brain chemistry<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">How the brain regulates mood<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"21\" cy=\"20\" r=\"8\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"39\" cy=\"22\" r=\"6\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M9 46C9 36 14 31 21 31C28 31 33 36 33 46\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M35 33C41 33 47 37 47 46\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Family history<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">It can run in families<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M31 7L16 32H27L25 49L41 23H30L31 7Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Stress or loss<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Trauma, grief, or big change<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M8 28C12 19 19 14 28 14C37 14 44 19 48 28C44 37 37 42 28 42C19 42 12 37 8 28Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"28\" r=\"7\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Isolation<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Loneliness can deepen it<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 46C28 46 8 34 8 20.5C8 14 12.5 10.5 17 10.5C21 10.5 25 13 28 17C31 13 35 10.5 39 10.5C43.5 10.5 48 14 48 20.5C48 34 28 46 28 46Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Other health issues<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Illness and hormones play a part<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 10L48 44H8L28 10Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M28 24V33\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"39\" r=\"1.7\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Substance use<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Alcohol and drugs make it worse<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"The signs\" data-screen-label=\"06\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#CFE0F4;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"5771c362-c2ff-40a0-84dd-370ba5aaa63d\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><svg width=\"160\" height=\"60\" viewBox=\"0 0 170 64\" fill=\"none\" style=\"position:absolute;top:74px;left:110px;\"><rect x=\"30\" y=\"22\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#F2E7C9\" stroke-width=\"7\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#2D4E7E\" stroke-width=\"6\"><\u002Frect><\u002Fsvg><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #6E9BD6;opacity:0.38;bottom:-130px;right:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">What Depression Looks Like<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">A few of these for two weeks or more is worth paying attention to.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M41 32C37 38 29 40 23 36C17 32 16 24 20 18C13 20 9 28 12 35C15 43 24 47 32 44C37 42 40 38 41 32Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Sleep changes<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Too much or too little<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M8 28C12 19 19 14 28 14C37 14 44 19 48 28C44 37 37 42 28 42C19 42 12 37 8 28Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"28\" r=\"7\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Loss of interest<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">In things once enjoyed<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 10L48 44H8L28 10Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M28 24V33\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"39\" r=\"1.7\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Hopelessness<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Feeling worthless or numb<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M31 7L16 32H27L25 49L41 23H30L31 7Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Low energy<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Tired, slow, unmotivated<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 19C24 13 16 14 14 21C12 28 18 44 28 44C38 44 44 28 42 21C40 14 32 13 28 19Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M28 19V13C28 10 31 8 34 9\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Appetite shifts<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Eating more or less than usual<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"19\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M28 26V37\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"28\" cy=\"19\" r=\"1.8\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Trouble focusing<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Foggy thinking, slipping grades<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"It gets better\" data-screen-label=\"07\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#C2D6F0;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"a4b3e10e-06cf-413a-986f-aa60bb58fc41\" alt=\"\" style=\"position:absolute;left:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:84px;right:120px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #6E9BD6;opacity:0.38;top:-130px;left:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">What Actually Helps<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Depression responds to treatment. These are the things that actually help.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M10 13C10 11 12 9 14 9H42C44 9 46 11 46 13V31C46 33 44 35 42 35H24L15 43V35H14C12 35 10 33 10 31Z\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Talk to someone<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Telling a trusted adult is a strong first step.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"21\" cy=\"20\" r=\"8\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"39\" cy=\"22\" r=\"6\" stroke=\"#fff\" stroke-width=\"3\"><\u002Fcircle><path d=\"M9 46C9 36 14 31 21 31C28 31 33 36 33 46\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M35 33C41 33 47 37 47 46\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Professional support<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Doctors and counsellors have real tools that work.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M14 42C12 28 22 13 44 12C44 33 33 44 16 44\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M18 40C24 32 32 26 40 22\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Daily basics<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Sleep, movement, routine, and sunlight all help.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:20px;background:#E1ECF9;border-radius:20px;padding:24px 26px;box-shadow:0 8px 22px rgba(60,55,95,0.10);\"><div style=\"width:74px;height:74px;border-radius:18px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M19 8H25L28 19L23 22C25 28 30 33 36 35L39 30L50 33V39C50 44 46 47 41 46C24 43 13 32 10 15C9 10 12 8 17 8\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;line-height:1.08;\">Kids Help Phone<\u002Fdiv><div style=\"font-size:20px;color:#8AA4C8;font-weight:600;margin-top:5px;\">Call 1-800-668-6868 or text CONNECT to 686868.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Myth vs fact\" data-screen-label=\"08\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#CFE0F4;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"25a3a451-307c-4487-9972-292be0e53eb3\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><svg width=\"160\" height=\"60\" viewBox=\"0 0 170 64\" fill=\"none\" style=\"position:absolute;top:74px;right:110px;\"><rect x=\"30\" y=\"22\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#F2E7C9\" stroke-width=\"7\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"120\" height=\"30\" rx=\"15\" stroke=\"#2D4E7E\" stroke-width=\"6\"><\u002Frect><\u002Fsvg><div style=\"position:absolute;bottom:80px;left:104px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Myth vs Fact<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">A few things people get wrong about depression.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:18px;max-width:1560px;margin:0 auto;width:100%;\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;\"><div style=\"background:#B7CFED;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#8AA4C8\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#8AA4C8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:600;line-height:1.35;color:#566E94;\">Depression is just being dramatic.<\u002Fp><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#3C6FB5\" stroke-width=\"3\"><\u002Fcircle><path d=\"M19 28L25 34L37 21\" stroke=\"#3C6FB5\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:700;line-height:1.35;color:#2D4E7E;\">It is a recognised medical condition, not attention-seeking.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;\"><div style=\"background:#B7CFED;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#8AA4C8\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#8AA4C8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:600;line-height:1.35;color:#566E94;\">People can just snap out of it.<\u002Fp><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#3C6FB5\" stroke-width=\"3\"><\u002Fcircle><path d=\"M19 28L25 34L37 21\" stroke=\"#3C6FB5\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:700;line-height:1.35;color:#2D4E7E;\">You cannot will it away any more than a broken leg.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;\"><div style=\"background:#B7CFED;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#8AA4C8\" stroke-width=\"3\"><\u002Fcircle><path d=\"M20 20L36 36M36 20L20 36\" stroke=\"#8AA4C8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:600;line-height:1.35;color:#566E94;\">Asking if someone is okay makes it worse.<\u002Fp><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:18px;padding:24px 30px;display:flex;gap:18px;align-items:center;\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 56 56\" fill=\"none\"><circle cx=\"28\" cy=\"28\" r=\"20\" stroke=\"#3C6FB5\" stroke-width=\"3\"><\u002Fcircle><path d=\"M19 28L25 34L37 21\" stroke=\"#3C6FB5\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><p style=\"font-size:23px;font-weight:700;line-height:1.35;color:#2D4E7E;\">Checking in shows you care and can save a life.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"In focus\" data-screen-label=\"09\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#C2D6F0;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;align-items:center;gap:64px;padding:0 110px;\"><img src=\"31344fe2-af68-4ced-8143-a5e9efa61c1e\" alt=\"\" style=\"position:absolute;left:26px;top:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:80px;right:120px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #6E9BD6;opacity:0.38;bottom:-130px;left:-110px;\"><\u002Fdiv><div style=\"flex:none;width:620px;height:680px;border-radius:28px;border:6px solid #fff;box-shadow:0 16px 40px rgba(40,40,80,0.20);overflow:hidden;background:#B7CFED;\"><image-slot id=\"dep-photo-v2\" src=\"c76bddd6-759a-43a2-a6a8-5c8172605cb7\" style=\"width:100%;height:100%;display:block;background:#DCEAF8;\" shape=\"rect\" fit=\"cover\" placeholder=\"Drag your own photo here to swap\"><\u002Fimage-slot><\u002Fdiv><div style=\"flex:1;\"><div style=\"font-family:'Mulish';font-weight:800;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;color:#8AA4C8;margin-bottom:10px;\">If a friend is struggling<\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:60px;line-height:1.0;margin-bottom:18px;\">How to Show Up<\u002Fh2><p style=\"font-family:'Mulish';font-weight:500;font-size:23px;color:#566E94;line-height:1.5;margin-bottom:30px;max-width:760px;\">You do not need the perfect words. Being there matters most. Here is a simple way to help.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:16px;max-width:780px;\"><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#3C6FB5;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">1<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#2D4E7E;\">Listen without judging or rushing to fix<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#3C6FB5;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">2<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#2D4E7E;\">Take them seriously, and do not promise secrecy if they are unsafe<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#3C6FB5;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">3<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#2D4E7E;\">Tell a trusted adult together<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px;\"><div style=\"flex:none;width:50px;height:50px;border-radius:14px;background:#F2B84B;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:24px;\">4<\u002Fdiv><p style=\"font-size:22px;font-weight:600;color:#2D4E7E;\">Keep checking in afterwards<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Activity\" data-screen-label=\"10\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:#CFE0F4;font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 110px;\"><img src=\"aca5edd1-b991-4575-9e4c-574c0ae71ccb\" alt=\"\" style=\"position:absolute;right:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;top:84px;left:110px;width:150px;height:46px;background-image:radial-gradient(#3C6FB5 32%,transparent 34%);background-size:25px 24px;opacity:0.85;\"><\u002Fdiv><div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:46px solid #6E9BD6;opacity:0.38;bottom:-130px;right:-110px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:72px;text-align:center;margin-bottom:8px;\">Your Turn, Talk It Through<\u002Fh2><p style=\"font-family:'Mulish';font-weight:600;font-size:25px;color:#566E94;text-align:center;margin-bottom:46px;max-width:1200px;margin-left:auto;margin-right:auto;\">Small groups, and keep it judgment-free.<\u002Fp><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:34px;max-width:1480px;margin:0 auto;width:100%;\"><div style=\"background:#E1ECF9;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:800;font-size:34px;color:#F2B84B;margin-bottom:18px;\">Scenario<\u002Fdiv><p style=\"font-size:23px;font-weight:500;color:#566E94;line-height:1.5;\">A friend texts you that nothing feels worth it lately. What do you reply, and what do you do next?<\u002Fp><\u002Fdiv><div style=\"background:#E1ECF9;border-radius:24px;padding:44px;box-shadow:0 10px 28px rgba(60,55,95,0.10);\"><div style=\"font-family:'Playfair Display';font-weight:800;font-size:34px;color:#2E5894;margin-bottom:18px;\">Talk about it<\u002Fdiv><ul style=\"font-size:23px;font-weight:500;color:#566E94;line-height:1.7;padding-left:24px;margin:0;\"><li>What words show you are listening?<\u002Fli><li>Who is a trusted adult you could go to?<\u002Fli><li>Why is keeping this secret risky?<\u002Fli><li>What would you want a friend to do for you?<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section data-label=\"Recap\" data-screen-label=\"11\" data-speaker-notes=\"\" style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(150deg,#BFD6F0 0%,#CFE0F4 70%);font-family:'Mulish',sans-serif;color:#2D4E7E;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 110px;\"><img src=\"3a920e8a-a9b0-47da-808a-e97cff9ca2bb\" alt=\"\" style=\"position:absolute;left:26px;bottom:26px;width:128px;height:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(40,40,80,0.16));\"><div style=\"position:absolute;width:380px;height:380px;border-radius:50%;border:54px solid #6E9BD6;opacity:0.4;top:-160px;right:-150px;\"><\u002Fdiv><div style=\"position:absolute;width:200px;height:200px;border-radius:50%;background:#2E5894;opacity:0.5;bottom:-100px;left:-100px;\"><\u002Fdiv><h2 style=\"font-family:'Playfair Display';font-weight:800;font-size:74px;margin-bottom:30px;position:relative;\">Three Things to Carry<\u002Fh2><div style=\"display:flex;gap:22px;margin-bottom:42px;position:relative;\"><div style=\"width:230px;background:#E1ECF9;border-radius:22px;padding:30px;box-shadow:0 10px 26px rgba(60,55,95,0.10);\"><div style=\"width:76px;height:76px;border-radius:19px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M28 46C28 46 8 34 8 20.5C8 14 12.5 10.5 17 10.5C21 10.5 25 13 28 17C31 13 35 10.5 39 10.5C43.5 10.5 48 14 48 20.5C48 34 28 46 28 46Z\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#2D4E7E;\">Notice<\u002Fdiv><\u002Fdiv><div style=\"width:230px;background:#E1ECF9;border-radius:22px;padding:30px;box-shadow:0 10px 26px rgba(60,55,95,0.10);\"><div style=\"width:76px;height:76px;border-radius:19px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M10 13C10 11 12 9 14 9H42C44 9 46 11 46 13V31C46 33 44 35 42 35H24L15 43V35H14C12 35 10 33 10 31Z\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#2D4E7E;\">Listen<\u002Fdiv><\u002Fdiv><div style=\"width:230px;background:#F2B84B;border-radius:22px;padding:30px;box-shadow:0 10px 26px rgba(60,55,95,0.10);\"><div style=\"width:76px;height:76px;border-radius:19px;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 56 56\" fill=\"none\"><path d=\"M19 8H25L28 19L23 22C25 28 30 33 36 35L39 30L50 33V39C50 44 46 47 41 46C24 43 13 32 10 15C9 10 12 8 17 8\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Playfair Display';font-weight:800;font-size:38px;color:#fff;\">Tell<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1180px;width:100%;position:relative;\"><div style=\"background:rgba(255,255,255,0.5);border-radius:18px;padding:26px 32px;text-align:left;\"><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;margin-bottom:8px;\">Need to talk?<\u002Fdiv><p style=\"font-size:21px;font-weight:500;color:#566E94;line-height:1.4;\">Kids Help Phone: 1-800-668-6868 or text CONNECT to 686868, any time.<\u002Fp><\u002Fdiv><div style=\"background:rgba(255,255,255,0.5);border-radius:18px;padding:26px 32px;text-align:left;\"><div style=\"font-family:'Playfair Display';font-weight:700;font-size:26px;margin-bottom:8px;\">In a crisis<\u002Fdiv><p style=\"font-size:21px;font-weight:500;color:#566E94;line-height:1.4;\">9-8-8 Suicide Crisis Helpline, call or text 9-8-8, 24/7 across Canada.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;bottom:54px;display:flex;align-items:center;gap:12px;\"><div style=\"width:38px;height:38px;border-radius:11px;background:#3C6FB5;display:flex;align-items:center;justify-content:center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span style=\"font-family:'Playfair Display';font-weight:700;font-size:24px;color:#2D4E7E;\">Together for Health<\u002Fspan><\u002Fdiv><\u002Fsection>\n<!--MORE-->\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
